name: Android beta APK
on:
  push:
    branches: [dev]
  pull_request:
    paths: ["android/**", "js/**", "css/**", "pages/**", "assets/**", "index.html", "package*.json", "capacitor.config.json", "scripts/**", "tests/**", ".github/workflows/android-apk.yml"]
  workflow_dispatch:
    inputs:
      variant:
        description: "Beta distribuível: debug e release exigem assinatura persistente"
        required: true
        default: debug
        type: choice
        options: [debug, release]
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - run: npm ci && npm run check && npm test
      - run: npm run android:sync && node scripts/check-android.mjs
      - name: Compile isolated validation APK (never distribute)
        run: android/gradlew -p android :app:assembleDebug --no-daemon
      # Deliberately no upload-artifact for validation APKs.

  distribute:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # Reserve immutable versionCode tags; no GitHub Release.
    concurrency:
      group: android-beta-distribution
      cancel-in-progress: false
    env:
      VARIANT: ${{ inputs.variant }}
      ANDROID_DISTRIBUTION: 'true'
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Require dev and all four signing secrets
        run: |
          test "$GITHUB_REF" = refs/heads/dev || { echo '::error::Distribuição beta deve usar a branch dev.'; exit 1; }
          node scripts/android-signing.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'build-tools;34.0.0'
      - run: npm ci && npm run check && npm test
      - run: npm run android:sync && node scripts/check-android.mjs
      - name: Reserve increasing versionCode
        env:
          ANDROID_VERSION_CODE_FLOOR: ${{ vars.ANDROID_VERSION_CODE_FLOOR || '3000001' }}
        run: node scripts/reserve-android-version.mjs
      - name: Restore mandatory persistent signing key
        run: |
          umask 077
          node scripts/android-signing.mjs "$RUNNER_TEMP/beta.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/beta.jks" >> "$GITHUB_ENV"
      - name: Compile and verify signed APK
        id: artifact
        run: |
          case "$VARIANT" in
            debug) task=:app:assembleDebug ;;
            release) task=:app:assembleRelease ;;
            *) echo '::error::Variante inválida'; exit 1 ;;
          esac
          android/gradlew -p android "$task" --no-daemon
          app_version=$(node -p "require('./package.json').version")
          artifact="lollipop-$app_version-$VARIANT-$ANDROID_VERSION_CODE"
          mkdir -p android-artifact
          cp "android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" "android-artifact/$artifact.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "android-artifact/$artifact.apk" > android-artifact/certificate.txt
          (cd android-artifact && sha256sum "$artifact.apk" > "$artifact.apk.sha256")
          echo "name=$artifact" >> "$GITHUB_OUTPUT"
      - name: Upload official signed beta APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: android-artifact/
          if-no-files-found: error
          retention-days: 14
      - name: Delete temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/beta.jks"

  android-smoke:
    # Isolated emulator build: never receives signing secrets or distributes an APK.
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.0"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci && npm run android:sync
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Precompile isolated application and instrumentation APKs
        run: |
          sdkmanager 'build-tools;34.0.0' 'platforms;android-35'
          android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2
      - name: Initialize smoke diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/android-smoke"
          echo 'phase=emulator-runner-not-entered' > "$RUNNER_TEMP/android-smoke/result.txt"
          free -m > "$RUNNER_TEMP/android-smoke/memory-before.txt"
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          ram-size: 2048
          cores: 2
          script: bash scripts/android-smoke.sh
      - name: Record device state after runner cleanup
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/android-smoke"
          timeout 10 adb devices -l > "$RUNNER_TEMP/android-smoke/devices-after-runner.txt" 2>&1 || echo 'ADB unavailable after teardown' >> "$RUNNER_TEMP/android-smoke/devices-after-runner.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-webview-test-report
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/android-smoke/
          if-no-files-found: warn
